# Copy to config/local.yaml; that deployment-specific file is not tracked.
# Telemetry is always read-only; optional controls require an explicit configuration opt-in.
modbus:
  # Container-side name; Compose maps a stable physical USB hub port here.
  device: /dev/heat-pump
  unit_id: 1
  baudrate: 9600
  bytesize: 8
  parity: N
  stopbits: 1
  timeout_seconds: 3

mqtt:
  host: 127.0.0.1
  port: 1883
  topic_prefix: heat_pump/utility_room
  discovery_prefix: homeassistant
  device_name: Heat Pump
  device_identifier: heat_pump_utility_room

# Hide unsupported/unneeded values both from MQTT state publication and HA Discovery.
# Existing retained Discovery topics are cleared during service start.
telemetry:
  excluded:
    - thermostat
    - remote_room_temperature
  # UniPi-compatible: publish immediately, then only changes of at least this many °C.
  temperature_diff: 0.2

# Controls are disabled by default. Set enabled: true only after the BMS protocol and
# controller behavior have been verified for this installation.
control:
  enabled: false

runtime:
  poll_interval_seconds: 5
  log_level: INFO
